[websocket]
port = 9200

[dynamixel]
protocol_version = 2.0
device_name = "/dev/ttyUSB0"

ids = [1, 2, 3, 4, 5]   # Pitch, Roll_R, Roll_L, Yaw, Mouth
baudrate = 2000000      # 9600, 57600, 115200, 1000000, 2000000, 3000000, 4000000, 4500000
is_time_based = true    # true: Time-based, false: Velocity-based
operating_mode = 4      # 1: Velocity, 3: Position, 4: Extended Position, 16: PWM
return_delay_time = 0

profile_velocity_homing = 500   # 기기 부팅 시 초기 위치로 이동할 때 속도
profile_velocity = 60
profile_velocity_calib = 100   # 캘리브레이션 판정 루프용 (time-based: goal 도달 시간 ms)
profile_acceleration = 0

pos_p_gain = [500, 500, 500, 500, 500]
pos_i_gain = [0, 0, 0, 0, 0]
pos_d_gain = [0, 0, 0, 0, 0]
ff1_gain = [0, 0, 0, 0, 0]
ff2_gain = [0, 0, 0, 0, 0]

[robot]
# 모터 초기 위치는 기기별 [robot.unitN] 섹션에서 선택된다 (파일 하단).
# 실행 전 RAY_UNIT 환경변수 필수 (예: RAY_UNIT=unit1). 미설정/오타 시 기동 실패.

led_pwm_pin       = 13              # LED 밝기 PWM용 BCM GPIO 번호 (GPIO13, 물리 33번). -1 = 비활성
led_pwm_range     = 100             # softPwm duty 범위 (0..range). 100 → ~100Hz
# PWM LED가 없는 기기에서는 부팅 서비스(led-pwm.service)가 없으므로 자동 비활성된다.

#robot parameter
pulley_diameter = 40
height = 110                        # 베이스부터 실이 연결된 레이어 까지의 높이 small -> 100,Large -> 180
hole_radius = 25                    # 로봇 머리 구멍 반지름 small -> 25, Large -> 50
yaw_gear_ratio = 1                  # yaw 모터가 direct하게 머리를 회전시킨다면 1로 설정 아니면 2
# 보상 계수 = 곱셈 인자 (값↑ → 보상↑). 코드: ...- delta_mouth*mouth_back, ...- pitch_diff*mouth_pitch
mouth_back_compensation = 0.75    # 입 움직임에 대한 뒷쪽 보상 (값↑=보상↑). 예전 분모 1.3과 동일 거동(=1/1.3). small≈0.83, Large≈0.67
mouth_pitch_compensation = 0.58   # pitch에 따른 입 움직임 보상 (값↑=보상↑). 예전 분모 1.7과 동일 거동(=1/1.7)

max_mouth = 0
min_mouth = 300                    # 최대 mouth movement size in DXL dimension

# ===== 캘리브레이션 이완 단계 =====
# 시작 시 roll/pitch 와이어를 자이로 변화가 멎을 때까지 풀고, mouth는 고정량만 푼 뒤 조정 시작
calib_release_step_tick   = 100    # 이완 1스텝 풀기 양(틱). 한 스텝 = 이만큼 풀고 자이로 판정 1회
calib_release_noise_g     = 0.05   # 스텝당 3축 가속도 변화합(g) 임계 — 미만이면 이완 완료
calib_release_mouth_tick  = 250    # mouth 고정 이완량(틱) — 턱은 자이로로 감지 불가
calib_mouth_backoff_tick  = 60     # mouth 장력점 감지 후 되돌리는 양(틱). 입이 과하게 벌어지면 키울 것

# 머리 올릴 시: back 0.7692(=1/1.3), pitch 0.5882(=1/1.7), min 400
# 안 올릴 시: back 1.0, pitch 1.0, min 350


# motion generation
generate_head_motion = true        # 헤드 모션 온라인 생성 여부
wait_mode_rpy_ratio = 3.0           # 대기모드에서 최종 roll, pitch, yaw 값에 곱해지는 비율
control_motor_rpy_ratio = 3.0       # 온라인 생성 시 최종 roll, pitch, yaw 값에 곱해지는 비율


# ---------------------------------------------------------------------------
# 기기별 모터 초기 위치 — RAY_UNIT 환경변수로 선택
# ---------------------------------------------------------------------------

[robot.unit1]
default_pitch   = 3460
default_roll_r  = 1900
default_roll_l  = 1350
default_yaw     = 1000
default_mouth   = 3040

[robot.unit2]
default_pitch   = 1100
default_roll_r  = 2750
default_roll_l  = 1450
default_yaw     = 2085
default_mouth   = 1980

[robot.unit3]
default_pitch   = 1100
default_roll_r  = 2750
default_roll_l  = 1450
default_yaw     = 3600
default_mouth   = 1980

[robot.unit4]
default_pitch   = 4478
default_roll_r  = 65
default_roll_l  = 2186
default_yaw     = 3560
default_mouth   = 848
calib_ax_offset = 0.036   # 육안 수평일 때의 Ax(g) — 센서 장착 기울기 보정 (기기별, 생략 시 0).
                          # 측정법: 토크 온 + Wizard로 roll 육안 수평 후 가속도 20회 평균 (2026-09-01)
