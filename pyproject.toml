[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ray-revamped"
version = "0.1.0"
description = "Voice conversation robot pipeline"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-speech>=2.0,<3.0",
    "openai>=1.66,<2.0",
    "elevenlabs>=2.52,<3.0",
    "websockets>=14.0,<17.0",
    "tiktoken>=0.5",
    "silero-vad>=5.0",
    "pyaudio>=0.2.14",
    "onnxruntime>=1.24",
    "transformers>=4.0",
    "sentence-transformers>=3.0,<4.0",
    "optimum[onnxruntime]",
    "num2words>=0.5.14",
    "rpi5-ws2812>=0.1.2 ; sys_platform == 'linux'",
]

[tool.uv.sources]
turngpt = { path = "external/TurnGPT", editable = true }

[project.optional-dependencies]
models-pytorch = [
    "turngpt",
    "maai>=0.1",
    "einops>=0.8",
    "omegaconf>=2.3",
    "pytorch-lightning>=2.0",
    "torchmetrics>=1.8",
    "wandb>=0.25",
    "soundfile>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.15.2",
]

[project.scripts]
ray = "voice_pipeline.__main__:main"

[tool.setuptools.packages.find]
include = ["voice_pipeline*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["voice_pipeline/tests"]
addopts = "-m 'not requires_model and not requires_api'"
markers = [
    "requires_model: tests requiring real model files",
    "requires_api: tests requiring real API credentials (Google Cloud, OpenAI, etc.)",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
"voice_pipeline/__main__.py" = ["E402"]
"evaluation/run.py" = ["E402"]
"evaluation/calibrate_noise.py" = ["E402"]
"evaluation/dashboard.py" = ["E501"]
"scripts/bench/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["voice_pipeline", "evaluation"]
