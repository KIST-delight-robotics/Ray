[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ray-revamped"
version = "0.1.0"
description = "Voice conversation robot pipeline"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-speech>=2.0,<3.0",
    "openai[realtime]>=3.13,<4.0",
    "websockets>=14.0,<17.0",
    "tiktoken>=0.5",
    "silero-vad>=5.0",
    "pyaudio>=0.2.14",
    "soundfile>=0.13",
    "pyusb>=1.2",
    "onnxruntime>=1.24",
    "sentence-transformers>=3.0,<4.0",
    "optimum[onnxruntime]",
    "rpi5-ws2812>=0.1.2 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.15.2",
]

[project.scripts]
ray = "voice_pipeline.__main__:main"

[tool.setuptools.packages.find]
include = ["voice_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["voice_pipeline/tests"]
addopts = "-m 'not requires_model and not requires_api'"
markers = [
    "requires_model: tests requiring real model files",
    "requires_api: tests requiring real API credentials (Google Cloud, OpenAI, etc.)",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
"voice_pipeline/__main__.py" = ["E402"]
"scripts/bench/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["voice_pipeline"]
