[project]
name = "ray-revamped"
version = "0.1.0"
description = "Voice conversation robot pipeline"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-speech>=2.0,<3.0",
    "openai>=1.66,<2.0",
    "psutil>=7.2.2",
    "pyaudio>=0.2.14",
    "silero-vad>=5.0",
    "tiktoken>=0.5",
    "websockets>=14.0,<17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
ray = "voice_pipeline.__main__:main"

[tool.pytest.ini_options]
testpaths = ["voice_pipeline/tests"]
addopts = "-m 'not requires_model and not requires_api'"
markers = [
    "requires_model: tests requiring real model files",
    "requires_api: tests requiring real API credentials (Google Cloud, OpenAI, etc.)",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["voice_pipeline"]
